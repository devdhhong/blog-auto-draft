# 코드가 main에 올라올 때마다 윈도우·맥 버전을 같은 코드로 함께 빌드하고,
# app/common.py 의 APP_VERSION 이름(v1.0.0 등)으로 한 릴리스에 같이 올린다 → 두 버전이 항상 같음.
name: build
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
          - os: macos-latest        # Apple Silicon (M1~)
            label: mac-apple-silicon
          - os: macos-15-intel      # 인텔 맥
            label: mac-intel
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.label == 'mac-intel' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Build info
        shell: bash
        run: |
          VER="$(grep -oE 'APP_VERSION = "[^"]+"' app/common.py | head -1 | cut -d'"' -f2)"
          echo "REPO = \"${GITHUB_REPOSITORY}\"" > app/_build_info.py
          echo "VERSION = \"${VER}\"" >> app/_build_info.py
          echo "NBH_VERSION=${VER}" >> $GITHUB_ENV
      - name: PyInstaller
        run: pyinstaller --noconfirm BlogAutoDraft.spec
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item dist/BlogAutoDraft.exe pkg/
          Copy-Item docs/사용법.txt pkg/
          Compress-Archive -Path pkg/* -DestinationPath BlogAutoDraft-${{ matrix.label }}.zip
      - name: Package (Mac)
        if: runner.os == 'macOS'
        run: |
          cp docs/사용법.txt dist/
          cd dist && ditto -c -k --sequesterRsrc --keepParent "블로그 자동 임시저장.app" app.zip
          mkdir pkg && mv app.zip pkg/ && cp 사용법.txt pkg/
          cd pkg && unzip -q app.zip && rm app.zip && cd ..
          ditto -c -k pkg ../BlogAutoDraft-${{ matrix.label }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BlogAutoDraft-${{ matrix.label }}
          path: BlogAutoDraft-${{ matrix.label }}.zip
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NBH_VERSION }}
          name: v${{ env.NBH_VERSION }}
          target_commitish: ${{ github.sha }}
          overwrite_files: true
          files: BlogAutoDraft-${{ matrix.label }}.zip
